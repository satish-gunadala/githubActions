name: multistage workflow

on:
  workflow_dispatch:

jobs:
  initialise:
    runs-on: alpine:latest
    steps:
      - name: initialise code
        run: echo "initialising code..."

  build:
    runs-on: ubuntu-latest
    needs: initialise
    steps:
      - name: Build stage
        run: echo "Building the application..."
      - name: Simulate build process
        run: sleep 5
      - name: Print build success message
        run: echo "Build completed successfully!"

  test:
    runs-on: alpine:latest
    needs: build
    steps:
      - name: Test stage
        run: echo "Running tests..."
      - name: Simulate test process
        run: sleep 5
      - name: Print test success message
        run: echo "Tests completed successfully!"
