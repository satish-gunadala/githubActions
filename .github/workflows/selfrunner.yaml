name: Run On Minikube ARC Runner

on:
  workflow_dispatch:

jobs:
  test-runner-pod:
    runs-on: minikube-runner

    steps:
      - name: Print runner details
        run: |
          echo "Hello from GitHub Actions runner pod"
          hostname
          whoami
          pwd

      - name: Check OS
        run: |
          uname -a
          cat /etc/os-release